name: snake

on:
  schedule:
    - cron: "0 0 * * *"   # daily at midnight UTC
  workflow_dispatch:        # allow manual trigger
  push:
    branches:
      - main

jobs:
  generate:
    name: Generate contribution snake
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: parthinverse
          outputs: |
            dist/github-contribution-snake.svg?palette=github-light&color_snake=#1a7f37
            dist/github-contribution-snake-dark.svg?palette=github-dark&color_snake=#3fb950&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Optimize animation speed
        run: |
          node -e '
            const fs = require("fs");
            const files = [
              "dist/github-contribution-snake.svg",
              "dist/github-contribution-snake-dark.svg"
            ];
            files.forEach(file => {
              if (fs.existsSync(file)) {
                let content = fs.readFileSync(file, "utf8");
                content = content.replace(/(\d+)ms/g, (_, ms) => Math.round(ms * 0.5) + "ms");
                fs.writeFileSync(file, content);
              }
            });
            if (fs.existsSync("dist/github-contribution-snake.svg")) {
              fs.copyFileSync("dist/github-contribution-snake.svg", "dist/github-contribution-grid-snake.svg");
            }
            if (fs.existsSync("dist/github-contribution-snake-dark.svg")) {
              fs.copyFileSync("dist/github-contribution-snake-dark.svg", "dist/github-contribution-grid-snake-dark.svg");
            }
          '

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
