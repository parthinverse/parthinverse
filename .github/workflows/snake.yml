name: snake

on:
  schedule:
    - cron: "0 0 * * *"   # daily at midnight UTC
  workflow_dispatch:        # allow manual trigger
  push:
    branches:
      - main               # auto-runs on first deploy

jobs:
  generate:
    name: Generate contribution snake
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to push SVGs to output branch

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: parthinverse
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Pushes dist/ to the root of the `output` branch.
      # README references:
      #   https://raw.githubusercontent.com/parthinverse/parthinverse/output/github-contribution-grid-snake-dark.svg
      #   https://raw.githubusercontent.com/parthinverse/parthinverse/output/github-contribution-grid-snake.svg
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
