name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # daily at midnight UTC
  workflow_dispatch:        # allow manual trigger from Actions tab

jobs:
  generate:
    name: Generate contribution calendar
    runs-on: ubuntu-latest
    permissions:
      contents: write       # required for output_action: commit

    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          # ── Token ──────────────────────────────────────────────────────
          # plugin_calendar scope requirement (per metadata.yml): public_access
          # A scopeless classic PAT is sufficient. read:user is NOT required.
          #
          # GITHUB_TOKEN is NOT used here because it authenticates as
          # github-actions[bot], making `viewer` the bot rather than you.
          # The token must belong to YOUR account (parthinverse) so that
          # the contribution data is fetched for the correct user.
          #
          # Setup: GitHub → Settings → Developer settings →
          #        Personal access tokens → Tokens (classic)
          #        Select NO scopes (completely scopeless is fine)
          #        Add as repo secret named METRICS_TOKEN
          token: ${{ secrets.METRICS_TOKEN }}

          # committer_token is intentionally omitted.
          # action.yml default: ${{ github.token }} — the built-in
          # GITHUB_TOKEN handles the commit using contents: write above.

          user: parthinverse
          filename: github-metrics.svg   # committed to repo root on main branch
          output_action: commit

          base: ""                       # disable header/repos/activity sections
          config_timezone: Asia/Kolkata

          plugin_calendar: yes
          # Note: plugin_calendar_limit is NOT a valid v3.34 parameter.
          # The plugin shows the full available history by default.
          # To restrict to one year, no extra parameter is needed for v3.34.
